<!DOCTYPE html>
<html>
<head>
<title>AI Chatbot</title>

<style>
body{
font-family:Arial;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.chat-box{
width:400px;
height:600px;
background:#1e1e1e;
border-radius:15px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

.chat{
flex:1;
padding:15px;
overflow-y:auto;
color:white;
}

.message{
margin:10px 0;
padding:10px;
border-radius:10px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#007bff;
margin-left:auto;
}

.bot{
background:#333;
}

.input-area{
display:flex;
padding:10px;
background:#222;
}

input{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:8px;
background:#333;
color:white;
}

button{
padding:12px 18px;
margin-left:10px;
border:none;
border-radius:8px;
background:#00c853;
color:white;
cursor:pointer;
}
</style>

</head>
<body>

<div class="chat-box">

<div class="chat" id="chat"></div>

<div class="input-area">
<input type="text" id="input" placeholder="Message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const API_KEY = "sk-clPJjhnNbEfK0NosFSqES3MaWzLf9dMshjPBIRrjENKJwAAs";
const API_URL = "sk-clPJjhnNbEfK0NosFSqES3MaWzLf9dMshjPBIRrjENKJwAAs";

async function sendMessage(){

const input = document.getElementById("input");
const chat = document.getElementById("chat");

let text = input.value.trim();

if(!text) return;

chat.innerHTML += `<div class="message user">${text}</div>`;
input.value="";

chat.innerHTML += `<div class="message bot" id="loading">Typing...</div>`;
chat.scrollTop = chat.scrollHeight;

try{

const response = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+API_KEY
},
body:JSON.stringify({
model:"YOUR_MODEL",
messages:[
{
role:"user",
content:text
}
]
})
});

const data = await response.json();

document.getElementById("loading").remove();

chat.innerHTML += `
<div class="message bot">
${data.choices[0].message.content}
</div>
`;

}catch(err){

document.getElementById("loading").remove();

chat.innerHTML += `
<div class="message bot">
Error: ${err.message}
</div>
`;

}

chat.scrollTop = chat.scrollHeight;

}

</script>

</body>
</html>
